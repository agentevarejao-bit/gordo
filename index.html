<style>
:root{--bg:#08111f;--bg2:#0d1829;--card:#101d31;--line:#1f3250;--tx:#e6edf7;--dim:#8a9bb5;--g:#3ddc84;--y:#ffc940;--r:#ff5c5c;--c:#5cc8ff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(74px + var(--sb))}
button{font-family:inherit}
.mono{font-family:var(--mono)}.dim{color:var(--dim)}.center{text-align:center}.small{font-size:12px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(#08111f,#08111fee);padding:calc(8px + var(--st)) 14px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--g)}
#hdrinfo{font-size:11px;color:var(--dim);line-height:1.35;margin-top:2px}#hdrinfo b{color:var(--tx)}
.clock{text-align:right}
#clk{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:.02em;color:var(--g);line-height:1}
.clock small{display:block;font-size:10px;color:var(--dim);letter-spacing:.12em;margin-top:3px}
.view{padding:12px 12px 20px;max-width:760px;margin:0 auto}
.view.mapa{padding:0;max-width:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sect{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:6px 0 10px;font-weight:700}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.cell span{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--dim);font-weight:700}
.cell b{display:block;font-family:var(--mono);font-size:21px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);font-weight:400;margin-top:1px}
.sumgrid .cell b{font-size:17px}
.cell.g b{color:var(--g)}.cell.y b{color:var(--y)}.cell.c b{color:var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2f{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.bar{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--g)}
.bar.thin{height:6px}.barlbl{font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-top:5px;font-family:var(--mono)}
.legtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.route{display:flex;align-items:center;justify-content:space-between;margin:14px 0;gap:8px}
.route>div:not(.arrow){flex:1;min-width:0}.route>div:last-child{text-align:right}
.route b{font-family:var(--mono);font-size:34px;letter-spacing:.04em;display:block;line-height:1}
.route small{display:block;font-size:11px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:var(--g);font-size:22px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.badge.PLANEJADA{color:var(--dim);border-color:var(--line)}.badge.EM_VOO{color:var(--y);border-color:#ffc94066;background:#ffc94014}.badge.CONCLUIDA{color:var(--g);border-color:#3ddc8466;background:#3ddc8414}
.alerts{margin-bottom:12px}

.al.ok{border-color:var(--g);color:#bff3d6}.al.warn{border-color:var(--y);color:#ffe9a8}.al.crit{border-color:var(--r);color:#ffc7c7;background:#ff5c5c12}.al.info{border-color:var(--c);color:#c6ebff}

.actions .btnrow{margin-top:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:12px;padding:13px 14px;font-size:13.5px;font-weight:800;letter-spacing:.06em;cursor:pointer;min-height:48px;flex:1}

.btn.critb{background:#3a1416;color:var(--r);border-color:#ff5c5c88}
.btn.ghost{background:transparent}
.btn.xl{width:100%;min-height:64px;font-size:17px;letter-spacing:.1em}
.btn.big{width:100%;min-height:56px}
.btn.sm{min-height:34px;padding:7px 10px;font-size:11px;flex:none}
.btnrow{display:flex;gap:8px;margin-top:10px}.btnrow.col{flex-direction:column}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.k{font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:700}.big2{font-family:var(--mono);font-size:24px;font-weight:700}

.tools button.r{color:var(--r)}.tools button:disabled{opacity:.3}
.mrow .tools{margin-top:0}

.hint.warn,.warnc{color:var(--y)}.okc{color:var(--g)}.critc,.crit{color:var(--r)}
label{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--dim);font-weight:700;margin:10px 0 0}
.inp{display:block;width:100%;margin-top:5px;background:#060d18;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font-size:16px;font-family:var(--sans)}
.inp.mono{font-family:var(--mono)}.inp.up{text-transform:uppercase}

.sel{background:#060d18;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:var(--mono);max-width:100%;min-width:0;flex:1}
.sel.full{width:100%;display:block;margin-top:5px;padding:12px;font-size:16px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin:8px 0}

.seg button.on{background:var(--line);color:var(--tx)}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#08111ff2;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.tli b{font-family:var(--mono);font-size:13px}.tli small{display:block;color:var(--dim);font-family:var(--mono);font-size:11px;margin-top:2px}
.ev{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.ev span{color:var(--dim);font-size:11px;margin-right:8px}.ev b{font-family:var(--mono);font-size:12px;color:var(--c)}.ev div{margin-top:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow b{font-family:var(--mono)}.mrow small{display:block;color:var(--dim);font-size:11px;margin-top:2px}.mrow.on b{color:var(--g)}
.mapbox{position:relative;height:calc(100vh - 74px - 62px - var(--st) - var(--sb));height:calc(100dvh - 74px - 62px - var(--st) - var(--sb));min-height:300px}
#map{width:100%;height:100%;display:block;touch-action:none;background:#060d18}
.mapov{position:absolute;left:10px;top:10px;right:64px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;pointer-events:none}
.tag{background:#08111fe6;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--dim)}
.tag.warn{color:var(--y);border-color:#ffc94088}.tag.ok{color:var(--g);border-color:#3ddc8488}.tag.crit{color:var(--r);border-color:#ff5c5c88}.tag.inline{display:inline-block;margin-bottom:8px}
.mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:46px;height:46px;border-radius:10px;background:#08111fe6;border:1px solid var(--line);color:var(--tx);font-size:22px;font-weight:700}
.mapbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center}
.mapbar .sel{background:#08111fee}
#print{display:none}
.card.install{border-color:var(--c);background:#0d2236}.card.install ol{margin:8px 0 4px;padding-left:20px;line-height:1.7;font-size:14px}.card.install .ico{display:inline-block;border:1px solid var(--dim);border-radius:4px;padding:0 4px;font-size:12px}
.minimap{position:relative;height:38vh;min-height:220px;max-height:360px;margin:4px -14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}

.minibtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.minibtns button{width:40px;height:40px;border-radius:9px;background:#08111fe6;border:1px solid var(--line);color:var(--tx);font-size:19px;font-weight:700;padding:0}
.legr small.real{color:var(--g)}
.minitag{position:absolute;left:10px;top:10px;background:#08111fe6;border:1px solid #ffc94088;color:var(--y);border-radius:8px;padding:5px 8px;font-size:10px;font-weight:800;letter-spacing:.08em}
.trk{margin:16px 2px 10px}

.trkline i{position:absolute;top:13px;height:4px;border-radius:2px;left:0}

.trkdot.a{left:-6px;background:var(--g)}.trkdot.b{right:-6px;background:#7f93ad}

.trknm{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 .cell b{font-size:18px}
.paxtime{font-size:34px;text-align:center;font-weight:800;padding:14px;-webkit-appearance:none;appearance:none;min-height:70px}
.pttprev{text-align:center;font-size:13px;color:var(--dim);margin:10px 0 4px;line-height:1.5}.pttprev b{color:var(--tx);font-family:var(--mono)}
.paxroute{text-align:center;font-family:var(--mono);font-size:30px;font-weight:800;margin:6px 0}.paxroute span{color:var(--y);font-size:22px;margin:0 8px}
.brandsub{font-size:9px;letter-spacing:.2em;color:var(--dim);margin-left:4px}
body.pax .brand{color:var(--y);font-size:15px}
#locclk{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:2px}
.paxpct{font-family:var(--mono);font-size:64px;font-weight:800;color:var(--c);text-align:center;line-height:1;margin-top:4px}.paxpct small{font-size:26px}
.leg.curleg{border-color:var(--y)}
.cd{display:inline-block;margin-top:4px;font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid}
.cd.ok{color:var(--g);border-color:#3ddc8466}.cd.warn{color:var(--y);border-color:#ffc94088}.cd.crit,.cd.late{color:var(--r);border-color:#ff5c5c99;background:#ff5c5c1a}
.cdcard{border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid;background:var(--card)}
.cdcard.ok{border-color:#3ddc8466}.cdcard.warn{border-color:var(--y);background:#2a2208}.cdcard.crit{border-color:var(--r);background:#2c0f12}.cdcard.late{border-color:var(--r);background:#2c0f12;animation:blink 1s steps(2) infinite}

.cdk{font-size:10.5px;letter-spacing:.1em;color:var(--dim);font-weight:800}

.cds{font-size:10.5px;letter-spacing:.08em;font-weight:800;color:var(--dim)}.cdz{font-family:var(--mono);font-size:13px;color:var(--tx)}
.cdsnd{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800;min-height:32px}

.simgrid span{display:block;font-size:9px;color:var(--dim);letter-spacing:.06em;font-weight:700}.simgrid b{font-family:var(--mono);font-size:15px}

<body>

</header>

<div id="print"></div>
<div id="toasts"></div>

}

/* =================== REGISTROS =================== */
function timeConfirm(title, captured, extra) {
  return new Promise(res => {
    modal(`<h3>${esc(title)}</h3>
      <div class="captured">${C.fmtZ(captured)}<small>${C.fmtDate(captured)} · UTC</small></div>
      <label>HORÁRIO (UTC) — edite se necessário<input id="tIn" class="inp mono" value="${C.fmtInput(captured)}" inputmode="numeric" autocomplete="off"></label>
      <div class="hint">Formato DD/MM/AAAA HH:MM, sempre em ZULU. Aceita também só HH:MM.</div>
      ${extra || ''}
      <div class="btnrow"><button class="btn ghost" data-x>CANCELAR</button><button class="btn go" data-ok>CONFIRMAR</button></div>`,
      (w, close) => {
        w.querySelector('[data-x]').onclick = () => { close(); res(null); };
        w.querySelector('[data-ok]').onclick = () => {
          const raw = w.querySelector('#tIn').value; let t = C.parseZ(raw); if (t == null) t = C.parseHHMMnear(raw, captured);
          if (t == null) { toast('HORÁRIO INVÁLIDO', 'crit'); return; }
          const note = w.querySelector('#nIn') ? w.querySelector('#nIn').value.trim() : '';
          close(); res({ t, note });
        };
      });
  });
}
async function registerTakeoff(m, l) {
  const captured = floorMin(nowMs());
  const other = m.legs.find(x => x !== l && legSt(m, x).status === 'EM_VOO');
  if (other && !(await confirmBox('ATENÇÃO', `<p>A etapa ${legNo(m, other)} (${esc(other.orig)}–${esc(other.dest)}) ainda está EM VOO, sem pouso registrado.</p><p>Registrar decolagem da etapa ${legNo(m, l)} mesmo assim?</p>`, 'CONTINUAR', 'warnb'))) return;
  const r = await timeConfirm('REGISTRAR DECOLAGEM — ETAPA ' + legNo(m, l) + ' ' + l.orig + '–' + l.dest, captured);
  if (!r) return;
  if (l.std != null && Math.abs(r.t - l.std) > 12 * 3600000 && !(await confirmBox('VERIFICAR HORÁRIO', `<p>A decolagem informada (${C.fmtDT(r.t)}) difere mais de 12h da prevista (${C.fmtDT(l.std)}).</p><p>Confirmar?</p>`, 'CONFIRMAR', 'warnb'))) return;
  addEvent(m, { type: 'TKOF', legId: l.id, value: r.t, captured });
  selLegId = l.id; toast('DECOLAGEM REGISTRADA ' + C.fmtZ(r.t), 'ok'); render();
  messageModal(m, l, 'TKOF');
}
async function registerLanding(m, l) {
  const captured = floorMin(nowMs()); const st = legSt(m, l);
  const r = await timeConfirm('REGISTRAR POUSO — ETAPA ' + legNo(m, l) + ' ' + l.orig + '–' + l.dest, captured);
  if (!r) return;
  if (r.t <= st.atot) { toast('POUSO DEVE SER POSTERIOR À DECOLAGEM (' + C.fmtDT(st.atot) + ')', 'crit'); return; }
  if (r.t - st.atot > 20 * 3600000 && !(await confirmBox('VERIFICAR HORÁRIO', `<p>Tempo de voo resultante: ${C.fmtDur(r.t - st.atot)}. Confirmar?</p>`, 'CONFIRMAR', 'warnb'))) return;
  addEvent(m, { type: 'LAND', legId: l.id, value: r.t, captured });
  toast('POUSO REGISTRADO ' + C.fmtZ(r.t), 'ok'); render();
  messageModal(m, l, 'LAND');
}

        let changed = false;

      if (w.querySelector('#cVL')) w.querySelector('#cVL').onclick = async () => { const n = reason(); if (!n) return; close(); if (await confirmBox('ANULAR POUSO', '<p>A etapa volta a EM VOO. Os registros permanecem no histórico.</p>', 'ANULAR', 'critb')) { addEvent(m, { type: 'LAND_VOID', legId: l.id, prev: st.ata, note: n }); render(); } };
    });
}

/* =================== MENSAGENS =================== */
/* Base do pernoite: onde a aeronave está e qual a próxima etapa planejada */
function overnightCtx(m, l) {
  const i = m.legs.indexOf(l), st = legSt(m, l);
  if (st.status === 'PLANEJADA') return { at: l.orig, next: l };
  const next = m.legs.slice(i + 1).find(x => legSt(m, x).status === 'PLANEJADA') || null;
  return { at: l.dest, next };
}
function acLines(m) {
  return `AERONAVE: ${m.aircraft}${m.callsign ? ' – ' + m.callsign : ''}` + (m.registration ? `\n\nMATRÍCULA: ${m.registration}` : '');
}
const dm = t => { const d = new Date(t); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
const sameDay = (a, b) => a != null && b != null && new Date(a).toISOString().slice(0, 10) === new Date(b).toISOString().slice(0, 10);
/* Mensagens enxutas para WhatsApp (*negrito*). Missão/OFRAG/aeronave ficam na descrição do grupo.
   tkofAt: horário a usar na decolagem ainda não registrada (padrão: agora) */
function buildMsg(m, l, kind, tkofAt) {
  const st = legSt(m, l), e = legEst(m, l), n = m.legs.length;
  const etp = x => `${legNo(m, x)}/${n}`;
  if (kind === 'GRP') {
    const L = m.legs; let route = '';
    L.forEach((x, i) => { route += (i === 0 ? x.orig : (L[i - 1].dest === x.orig ? '' : ' / ' + x.orig)) + ' – ' + x.dest; });
    const ac = [m.aircraft, m.callsign, m.registration].filter(Boolean).join(' · ');
    return `MISSÃO ${m.number}\nOFRAG ${m.ofrag}\n${ac}${m.unit ? '\n' + m.unit : ''}\n` +
      (L.length ? `Período: ${dm(L[0].std)} a ${C.fmtDate(L[L.length - 1].sta)}\nRota: ${route}\n\nEtapas (horários em Z):\n` +
        L.map((x, i) => `${String(i + 1).padStart(2, '0')}) ${dm(x.std)} ${x.orig}–${x.dest} ${C.fmtZ(x.std).slice(0, 5).replace(':', '')}–${C.fmtZ(x.sta).slice(0, 5).replace(':', '')}${sameDay(x.std, x.sta) ? '' : ' (+1)'}`).join('\n') : '');
  }
  if (kind === 'LAND' && st.ata != null) return `*POUSO – ETAPA ${etp(l)}*\nTrecho: ${l.orig} – ${l.dest}\nDecolagem: ${C.fmtZ(st.atot)}\nPouso: *${C.fmtZ(st.ata)}* (${dm(st.ata)})\nTempo de voo: *${C.fmtDur(st.ata - st.atot)}*`;
  if (kind === 'RON') {
    const c = overnightCtx(m, l), a = apt(c.at), nx = c.next;
    return `*PERNOITE – ${c.at}${a && a.city ? ' (' + a.city + ')' : ''}*\n` +
      (nx ? `Próx. decolagem: *${dm(nx.std)} ${C.fmtZ(nx.std)}*\nTrecho: ${nx.orig} – ${nx.dest} (etapa ${etp(nx)})\nPrev. pouso: ${C.fmtZ(nx.sta)}${sameDay(nx.std, nx.sta) ? '' : ' (' + dm(nx.sta) + ')'}` : 'Sem próxima etapa planejada');
  }
  // Decolagem: registrada => horário registrado; não registrada => horário atual (editável)
  const dep = st.atot != null ? st.atot : (tkofAt != null ? tkofAt : floorMin(nowMs()));
  const dur = (l.sta != null && l.std != null) ? l.sta - l.std : null;
  const eta = st.atot != null && e.eta != null ? e.eta : (dur != null ? dep + dur : l.sta);
  return `*DECOLAGEM – ETAPA ${etp(l)}*\nTrecho: ${l.orig} – ${l.dest}\nDecolagem: *${C.fmtZ(dep)}* (${dm(dep)})\nPrev. pouso: *${C.fmtZ(eta)}*${sameDay(dep, eta) ? '' : ' (' + dm(eta) + ')'}`;
}
function messageModal(m, l, kind) {
  modal(`<h3>MENSAGEM OPERACIONAL</h3>
    <div class="seg"><button data-k="TKOF" class="${kind === 'TKOF' ? 'on' : ''}">DECOLAGEM</button><button data-k="LAND" class="${kind === 'LAND' ? 'on' : ''}">POUSO</button><button data-k="RON" class="${kind === 'RON' ? 'on' : ''}">PERNOITE</button><button data-k="GRP" class="${kind === 'GRP' ? 'on' : ''}">GRUPO</button></div>
    <div class="hint" id="msgH"></div>
    <textarea id="msgT" class="inp mono" rows="9">${esc(buildMsg(m, l, kind))}</textarea>
    <button class="btn ghost" id="nowB" style="width:100%;margin-top:8px">ATUALIZAR COM HORÁRIO ATUAL (UTC)</button>
    <p class="hint">Edite livremente. *texto* = negrito no WhatsApp. Nada é enviado sem sua ação.</p>
    <button class="btn go xl" id="cp">COPIAR MENSAGEM</button>
    <div class="btnrow"><button class="btn ghost" id="sh">COMPARTILHAR</button><button class="btn ghost" data-close>FECHAR</button></div>`,
    (w) => {
      const ta = w.querySelector('#msgT'); let cur = kind;
      const hint = () => {
        const st = legSt(m, l);
        w.querySelector('#msgH').textContent = cur === 'TKOF' ? (st.atot != null ? 'Decolagem registrada às ' + C.fmtZ(st.atot) + '. Previsão = decolagem real + duração prevista.' : 'Decolagem ainda não registrada: usando o HORÁRIO ATUAL ' + C.fmtZ(floorMin(nowMs())) + ' + duração prevista ' + C.fmtDur(l.sta - l.std) + '.')
          : cur === 'RON' ? 'Local e próxima etapa planejada conforme a missão.' : cur === 'GRP' ? 'Texto para a DESCRIÇÃO do grupo (missão, OFRAG, aeronave e rota).' : 'Dados do pouso registrado.';
        w.querySelector('#nowB').style.display = cur === 'TKOF' && st.atot == null ? '' : 'none';
      };
      w.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
        if (b.dataset.k === 'LAND' && legSt(m, l).ata == null) return toast('POUSO AINDA NÃO REGISTRADO', 'warn');
        cur = b.dataset.k; w.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); ta.value = buildMsg(m, l, cur); hint();
      });
      w.querySelector('#nowB').onclick = () => { ta.value = buildMsg(m, l, 'TKOF', floorMin(nowMs())); hint(); toast('HORÁRIO ATUALIZADO ' + C.fmtZ(floorMin(nowMs())), 'ok'); };
      hint();
      w.querySelector('#cp').onclick = async () => {
        let ok = false;
        try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { }
        if (!ok) { try { ta.focus(); ta.select(); ta.setSelectionRange(0, 99999); ok = document.execCommand('copy'); } catch (e) { } }
        toast(ok ? 'MENSAGEM COPIADA' : 'NÃO FOI POSSÍVEL COPIAR — selecione o texto manualmente', ok ? 'ok' : 'crit');
      };
      w.querySelector('#sh').onclick = async () => {
        if (navigator.share) { try { await navigator.share({ text: ta.value }); } catch (e) { } }
        else toast('COMPARTILHAMENTO NÃO SUPORTADO NESTE NAVEGADOR — use COPIAR', 'warn');
      };
    });
}

/* =================== ETAPAS =================== */

function legOriginal(m, l) { const e = (m.events || []).find(x => x.legId === l.id && x.type === 'LEG_ADD' && x.value); return e ? e.value : null; }

/* =================== BACKUP =================== */
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/json' }); const file = new File([blob], name, { type: type || 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad/.test(navigator.userAgent)) { navigator.share({ files: [file] }).catch(() => { }); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const stamp = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + '-' + p(d.getUTCHours()) + p(d.getUTCMinutes()) + 'Z'; };
function backupObj(ms) { return { zuluops: 'backup', v: 1, exportedAt: new Date().toISOString(), missions: ms, customAirports: S.customAirports }; }
function exportJSON(ms, base) { download(base.replace(/[^\w\-]/g, '_') + '-' + stamp() + '.json', JSON.stringify(backupObj(ms), null, 1)); toast('BACKUP GERADO', 'ok'); }
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt) { const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }

/* =================== CÓDIGO DE MISSÃO (ZULU OPS → GORDO) ===================
   Texto curto para colar no grupo. "GORDO1." = aberto · "GORDO1E." = protegido por senha (AES-256-GCM). */
const GORDO_URL = 'https://agentevarejao-bit.github.io/gordo/';
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const toMin = t => t == null ? 0 : Math.round(t / 60000), fromMin = x => x ? x * 60000 : null;
function missionToCodeObj(m) {
  return { v: 1, n: m.number, a: m.aircraft, r: m.registration || '', c: m.callsign || '', at: toMin(nowMs()),
    l: m.legs.map(l => { const st = legSt(m, l); return [l.id, l.orig, l.dest, toMin(l.std), toMin(l.sta), toMin(st.atot), toMin(st.ata)]; }) };
}
async function encodeMissionCode(m, pw) {
  const raw = new TextEncoder().encode(JSON.stringify(missionToCodeObj(m)));
  if (!pw) return 'GORDO1.' + b64u(raw);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pw, salt), raw));
  const all = new Uint8Array(28 + ct.length); all.set(salt, 0); all.set(iv, 16); all.set(ct, 28);
  return 'GORDO1E.' + b64u(all);
}
function findMissionCode(text) { const mm = String(text || '').replace(/\s+/g, '').match(/GORDO1(E?)\.([A-Za-z0-9_-]{20,})/); return mm ? { enc: !!mm[1], data: mm[2] } : null; }
async function decodeMissionCode(code, pw) {
  let bytes = unb64u(code.data);
  if (code.enc) { const key = await deriveKey(pw, bytes.slice(0, 16)); bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(16, 28) }, key, bytes.slice(28))); }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (o.v !== 1 || !o.n || !Array.isArray(o.l) || !o.l.length) throw new Error('código inválido');
  o.l.forEach(x => { if (!Array.isArray(x) || x.length < 5 || !/^[A-Z0-9]{4}$/.test(x[1]) || !/^[A-Z0-9]{4}$/.test(x[2]) || !(x[4] > x[3])) throw new Error('etapa inválida'); });
  return o;
}
function codeMessage(m, code, pw) {
  return `✈️ *GORDO – MISSÃO ${m.number}*\n` + (GORDO_URL.startsWith('http') ? `App: ${GORDO_URL}\n` : '') +
    `Copie esta mensagem inteira e toque em *COLAR MISSÃO* no app.` + (pw ? `\nSenha: combinada com a tripulação.` : '') + `\n\n${code}`;
}

function askPw(title, twice) {

    (w, close) => { w.querySelector('[data-x]').onclick = () => { close(); res(null); }; w.querySelector('[data-ok]').onclick = () => { const a = w.querySelector('#p1').value; if (a.length < 6) return toast('MÍNIMO 6 CARACTERES', 'crit'); if (twice && a !== w.querySelector('#p2').value) return toast('SENHAS NÃO CONFEREM', 'crit'); close(); res(a); }; }));
}
async function exportEncrypted() {
  const pw = await askPw('BACKUP PROTEGIDO', true); if (!pw) return;
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pw, salt); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(backupObj(S.missions))));
    download('zuluops-protegido-' + stamp() + '.json', JSON.stringify({ zuluops: 'encrypted', v: 1, alg: 'AES-256-GCM/PBKDF2-SHA256-250k', salt: b64(salt), iv: b64(iv), data: b64(ct) }));
    toast('BACKUP PROTEGIDO GERADO', 'ok');
  } catch (e) { toast('FALHA NA CRIPTOGRAFIA: ' + e.message, 'crit'); }
}
function validMission(m) {
  const errs = [];
  if (!m || typeof m !== 'object') return ['missão inválida'];
  if (!m.id || typeof m.id !== 'string') errs.push('id ausente');
  if (!m.number) errs.push('número ausente'); if (!Array.isArray(m.legs)) errs.push('etapas ausentes');
  (m.legs || []).forEach((l, i) => { if (!l.id || !l.orig || !l.dest || typeof l.std !== 'number' || typeof l.sta !== 'number') errs.push('etapa ' + (i + 1) + ' incompleta'); });
  if (m.events && !Array.isArray(m.events)) errs.push('eventos inválidos');
  return errs;
}
function importFile() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let obj; try { obj = JSON.parse(await f.text()); } catch (e) { return toast('ARQUIVO NÃO É JSON VÁLIDO', 'crit'); }
    if (obj && obj.zuluops === 'encrypted') {
      if (!(window.crypto && crypto.subtle)) return toast('CRIPTOGRAFIA INDISPONÍVEL AQUI', 'crit');
      const pw = await askPw('SENHA DO BACKUP'); if (!pw) return;
      try { const key = await deriveKey(pw, unb64(obj.salt)); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(obj.iv) }, key, unb64(obj.data)); obj = JSON.parse(new TextDecoder().decode(pt)); }
      catch (e) { return toast('SENHA INCORRETA OU ARQUIVO CORROMPIDO', 'crit'); }
    }
    let ms = [];
    if (obj && obj.zuluops === 'backup' && Array.isArray(obj.missions)) ms = obj.missions;
    else if (obj && obj.zuluops === 'mission' && obj.mission) ms = [obj.mission];
    else return toast('FORMATO NÃO RECONHECIDO (não é arquivo ZULU OPS)', 'crit');
    const bad = ms.map(m => [m && m.number, validMission(m)]).filter(x => x[1].length);
    if (bad.length) return modal(`<h3>IMPORTAÇÃO RECUSADA</h3><p>O arquivo tem dados inválidos. Nada foi alterado.</p>${bad.map(b => `<div class="al crit">${esc(b[0] || '?')}: ${esc(b[1].join(', '))}</div>`).join('')}<div class="btnrow"><button class="btn ghost" data-close>OK</button></div>`);
    const custom = obj.customAirports || {}; const newAp = Object.keys(custom).filter(k => !S.customAirports[k]);
    if (!(await confirmBox('IMPORTAR', `<p>${ms.length} missão(ões): ${ms.map(m => esc(m.number) + ' (' + m.legs.length + ' etapas, ' + (m.events || []).length + ' registros)').join(', ')}.</p>${newAp.length ? `<p>Aeródromos manuais: ${newAp.map(esc).join(', ')}</p>` : ''}`, 'IMPORTAR'))) return;
    for (const m of ms) {
      m.events = m.events || [];
      const ex = S.missions.find(x => x.id === m.id);
      if (ex) {
        const rep = await confirmBox('MISSÃO ' + m.number + ' JÁ EXISTE', `<p>Neste aparelho: ${ex.legs.length} etapas, ${(ex.events || []).length} registros, salva por último em ${C.fmtDT(S.savedAt)}.</p><p>No arquivo: ${m.legs.length} etapas, ${m.events.length} registros.</p><p>SUBSTITUIR a versão do aparelho? (Cancelar = importar como cópia)</p>`, 'SUBSTITUIR', 'warnb');
        if (rep) S.missions[S.missions.indexOf(ex)] = m; else { m.id = uid(); m.number = m.number + ' (cópia)'; S.missions.push(m); }
      } else S.missions.push(m);
      m.events.push({ id: uid(), at: nowMs(), type: 'IMPORT', note: f.name });
      S.activeId = m.id;
    }
    newAp.forEach(k => S.customAirports[k] = custom[k]);
    selLegId = null; MAP.fitted = null; save(); render(); toast('IMPORTAÇÃO CONCLUÍDA', 'ok');
  };
  inp.click();
}

const fmtLocal = ms => ms == null ? '—' : new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

/* Etapa em voo é encerrada automaticamente na chegada estimada
   (ou quando a decolagem da etapa seguinte é iniciada). */
const _legStRaw = legSt;
legSt = (m, l) => {
  const st = _legStRaw(m, l);
  if (st.status !== 'EM_VOO' || l.sta == null || l.std == null) return st;
  const eta = st.atot + (l.sta - l.std), i = m.legs.indexOf(l);
  const laterStarted = m.legs.slice(i + 1).some(x => _legStRaw(m, x).atot != null);
  if (nowMs() > eta || laterStarted) return Object.assign({}, st, { ata: Math.min(eta, nowMs()), status: 'CONCLUIDA', ataEst: true });
  return st;
};

};
const _tick = tickClock;

/* Converte HH:MM (hora do celular ou Z) para o instante mais recente que já passou */
function pastFromHHMM(str, zulu) {
  const mm = String(str || '').match(/^(\d{1,2}):(\d{2})/); if (!mm) return null;
  const h = +mm[1], mi = +mm[2]; if (h > 23 || mi > 59) return null;
  const now = nowMs(), d = new Date(now); let t;
  if (zulu) t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), h, mi);
  else { const x = new Date(now); x.setHours(h, mi, 0, 0); t = x.getTime(); }
  if (t > now + 60000) t -= 86400000; // horário à frente de agora = foi ontem
  return t;
}

/* Plano de voo estilo companhia aérea: mapa + linha de progresso com o avião + dados */
/* Centraliza: enquadra a rota inteira; se já estiver enquadrada, aproxima no avião */
function centerOnPlane(m, l) {
  const e = legEst(m, l);
  if (MAP.fitted && MAP.lastCenter !== 'plane' && e.ok && e.pos) {
    let lon = e.pos.lon; MAP.cx = lon * Math.PI / 180; MAP.cy = Math.log(Math.tan(Math.PI / 4 + Math.max(-85, Math.min(85, e.pos.lat)) * Math.PI / 360));
    MAP.k = Math.max(MAP.k, 900); clampView(); MAP.lastCenter = 'plane';
  } else { MAP.fitted = null; MAP.lastCenter = 'route'; }
  drawMap();
}

  const cell = (k, val, cls) => `<div class="cell ${cls || ''}"><span>${k}</span><b>${val}</b></div>`;
  return `<div class="minimap" id="miniMap"><canvas id="map"></canvas><div class="minitag">POSIÇÃO ESTIMADA</div>
    <div class="minibtns"><button id="mmIn" aria-label="Aproximar">+</button><button id="mmOut" aria-label="Afastar">−</button><button id="mmC" aria-label="Centralizar">⌖</button><button id="mmF" aria-label="Tela cheia">⛶</button></div></div>
    ${trackHTML(l, st, e, eta, now)}
    <div class="grid3">${cell('TEMPO DE VOO', C.fmtDur(now - st.atot))}${cell('FALTAM (EST.)', C.fmtDur(Math.max(0, eta - now)), 'c')}${cell('CHEGADA (EST.)', C.fmtZ(eta) + `<i>celular ${fmtLocal(eta)}</i>`, 'c')}</div>`;
}
renderEtapas = function (v) {
  const m = mission(); if (!m) { v.innerHTML = '<div class="card center dim">Sem missão.</div>'; return; }
  const cur = currentLeg(m);
  v.innerHTML = `<div class="card"><div class="k">ROTEIRO DA MISSÃO</div><div class="big2">${esc(m.number)}</div><div class="hint">${esc(m.aircraft)}${m.registration ? ' · ' + esc(m.registration) : ''} · ${m.legs.length} etapas · horários em Z (e no fuso do celular)</div></div>` +
    m.legs.map((l, i) => {
      const st = legSt(m, l), o = apt(l.orig), d = apt(l.dest);
      return `<div class="card leg ${st.status} ${l === cur ? 'curleg' : ''}"><div class="row between"><div class="legno">${i + 1}</div>
        <div class="legr"><b>${esc(l.orig)} → ${esc(l.dest)}</b><small>${esc((o && (o.city || o.name)) || '')} → ${esc((d && (d.city || d.name)) || '')}</small>
        <small>PREVISTO ${C.fmtDate(l.std).slice(0, 5)} · ${C.fmtZ(l.std)} → ${C.fmtZ(l.sta)} · ${C.fmtDur(l.sta - l.std)}</small>
        ${st.atot != null && !tkPlanned(m, l) ? `<small class="real">DECOLOU ${C.fmtDate(st.atot).slice(0, 5)} ${C.fmtZ(st.atot)} · ${st.status === 'EM_VOO' ? 'CHEGADA EST. ' + C.fmtZ(st.atot + (l.sta - l.std)) : (st.ataEst ? 'CHEGADA EST. ' : 'POUSOU ') + C.fmtZ(st.ata)}</small>` : ''}
        ${tkPlanned(m, l) && st.ata != null ? `<small class="real">POUSOU ${C.fmtZ(st.ata)}</small>` : ''}</div>
        <span class="badge ${st.status}">${paxStatus(st)}</span></div></div>`;
    }).join('');
};

    <div class="kv"><span>SOM DA CONTAGEM</span><b><button class="btn sm ${S.settings.sound ? 'go' : 'ghost'}" id="gSnd">${S.settings.sound ? 'LIGADO' : 'DESLIGADO'}</button></b></div>
    <p class="hint">Bipe aos 2h, 1h, 30 min e no horário da decolagem — somente com o app aberto e após tocar na tela. Amarelo a menos de ${S.settings.cdWarnH}h e vermelho a menos de ${S.settings.cdCritH}h.</p></div>
  <div class="card"><div class="sect">MISSÃO</div>
    ${m ? `<div class="kv"><span>MISSÃO</span><b>${esc(m.number)}</b></div><div class="kv"><span>AERONAVE</span><b>${esc(m.aircraft)} ${esc(m.registration || '')}</b></div>` : ''}
    <div class="btnrow col"><button class="btn go" id="gPaste">COLAR MISSÃO (CÓDIGO DO GRUPO)</button><button class="btn ghost" id="gImp">IMPORTAR ARQUIVO .JSON</button><button class="btn critb" id="gRst" ${m ? '' : 'disabled'}>REINICIAR ACOMPANHAMENTO</button></div>

aircraftCard = function () { _acCard(); const b = document.querySelector('#acU'); if (b) b.remove(); };

setInterval(() => { if (tab === 'painel' && !modalOpen() && Date.now() - (MAP.touchAt || 0) > 4000) { const m = mission(); if (m && m.legs.some(l => legSt(m, l).status === 'EM_VOO')) { const y = window.scrollY; renderPainel($('#view')); window.scrollTo(0, y); } } }, 10000);
/* ===== COLAR MISSÃO (código gerado no ZULU OPS) ===== */
function importCodeObj(o) {
  const legs = o.l.map(x => ({ id: x[0], orig: x[1], dest: x[2], std: fromMin(x[3]), sta: fromMin(x[4]), waypoints: [] }));
  let m = S.missions.find(x => x.number === o.n);
  const isNew = !m;
  if (isNew) { m = { id: 'gordo-' + String(o.n).replace(/[^\w]/g, ''), number: o.n, aircraft: o.a, registration: o.r, callsign: o.c, legs, events: [], createdAt: nowMs() }; S.missions.push(m); }
  else { Object.assign(m, { aircraft: o.a, registration: o.r, callsign: o.c }); m.legs = legs; m.events = m.events || []; }
  let upd = 0;
  o.l.forEach(x => {
    const l = m.legs.find(y => y.id === x[0]), raw = _legStRaw(m, l), tk = fromMin(x[5]), ld = fromMin(x[6]);
    if (tk != null && raw.atot !== tk) { m.events.push({ id: uid(), at: nowMs(), type: 'TKOF', legId: l.id, value: tk, note: 'tripulação' }); upd++; }
    if (ld != null && tk == null && raw.atot == null) m.events.push({ id: uid(), at: nowMs(), type: 'TKOF', legId: l.id, value: l.std, planned: true, note: 'decolagem não informada — horário previsto' });
    if (ld != null && raw.ata !== ld) { m.events.push({ id: uid(), at: nowMs(), type: 'LAND', legId: l.id, value: ld, note: 'tripulação' }); upd++; }
  });
  m.events.push({ id: uid(), at: nowMs(), type: 'CODE_IMPORT', note: 'código de ' + C.fmtDT(fromMin(o.at)) });
  S.activeId = m.id; selLegId = null; save(); render();
  toast((isNew ? 'MISSÃO ' : 'MISSÃO ATUALIZADA ') + o.n + ' · ' + o.l.length + ' ETAPAS', 'ok');
}
function pasteMissionFlow() {
  modal(`<h3>COLAR MISSÃO</h3>
    <p class="hint">No grupo: pressione a mensagem com o código <b>GORDO1</b> → <b>Copiar</b>. Depois toque abaixo.</p>
    <button class="btn go big" id="cmPaste">COLAR DA ÁREA DE TRANSFERÊNCIA</button>
    <label>OU COLE O TEXTO AQUI<textarea id="cmT" class="inp mono" rows="4" placeholder="GORDO1..."></textarea></label>
    <div id="cmPwBox" style="display:none"><label>SENHA DA MISSÃO<input id="cmPw" class="inp" type="text" autocomplete="off"></label></div>
    <div id="cmMsg" class="hint"></div>
    <div class="btnrow"><button class="btn ghost" data-close>CANCELAR</button><button class="btn go" id="cmOk">CARREGAR</button></div>`,
    (w, close) => {
      const q = x => w.querySelector(x);
      const check = () => { const c = findMissionCode(q('#cmT').value); q('#cmPwBox').style.display = c && c.enc ? '' : 'none'; q('#cmMsg').innerHTML = !q('#cmT').value.trim() ? '' : c ? (c.enc ? 'Código protegido: informe a senha.' : '<span class="okc">Código reconhecido.</span>') : '<span class="critc">Não encontrei um código GORDO1 nesse texto.</span>'; return c; };
      const load = async () => {
        const c = check(); if (!c) return toast('CÓDIGO NÃO ENCONTRADO', 'crit');
        if (c.enc && !q('#cmPw').value.trim()) { q('#cmPw').focus(); return toast('INFORME A SENHA', 'warn'); }
        try { const o = await decodeMissionCode(c, q('#cmPw').value.trim()); close(); importCodeObj(o); }
        catch (e) { toast(c.enc ? 'SENHA INCORRETA OU CÓDIGO INCOMPLETO' : 'CÓDIGO INCOMPLETO OU INVÁLIDO', 'crit'); }
      };
      q('#cmT').addEventListener('input', check);
      q('#cmPaste').onclick = async () => {
        try { const t = await navigator.clipboard.readText(); q('#cmT').value = t; const c = check(); if (c && !c.enc) load(); else if (c) q('#cmPw').focus(); }
        catch (e) { q('#cmT').focus(); toast('TOQUE NO CAMPO E ESCOLHA "COLAR"', 'warn'); }
      };
      q('#cmOk').onclick = load;
    });
}

/* ===== INSTALAÇÃO NA TELA DE INÍCIO ===== */

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'painel' && !modalOpen()) render(); });

  const steps = isIOS

    : (installEvt ? `<button class="btn go big" id="instBtn">INSTALAR O GORDO</button>` : `<ol><li>Se abriu dentro do WhatsApp, toque em <b>⋮</b> → <b>Abrir no Chrome</b>.</li><li>No Chrome, toque em <b>⋮</b> → <b>Instalar app</b> (ou Adicionar à tela inicial).</li><li>Abra o GORDO pelo ícone.</li></ol>`);

}
function bindInstall() {
  const h = $('#instHide'); if (h) h.onclick = () => { S.settings.hideInstall = true; save(); render(); };

if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { })); }

/* Identidade visual GORDO */
document.title = 'GORDO';

})();

/* Missão pré-carregada: inserida só na primeira abertura; depois é dado comum (editável/removível) */
function applySeed() {
  if (!window.ZSEED) return;
  const ver = window.ZSEED.seedVersion || 1;
  if (S.seeded && (S.seedVersion || 1) >= ver) return;
  for (const sm of window.ZSEED.missions) {
    const ex = S.missions.find(x => x.id === sm.id || x.number === sm.number);
    if (ex) {
      if (!ex.registration && sm.registration) ex.registration = sm.registration;
      if (S.seeded && ex.id === sm.id) { // atualização do arquivo: acrescenta registros novos sem apagar os do aparelho
        const have = new Set((ex.events || []).map(e => e.id));
        const add = (sm.events || []).filter(e => !have.has(e.id) && e.legId && !(ex.events || []).some(x => x.legId === e.legId && x.type === e.type));
        if (add.length) ex.events = (ex.events || []).concat(add).sort((p, q) => p.at - q.at);
      }
      continue;
    }
    const m = JSON.parse(JSON.stringify(sm)); m.events = m.events || [];
    m.events.push({ id: uid(), at: nowMs(), type: 'IMPORT', note: 'missão pré-carregada no arquivo' });
    S.missions.push(m); if (!S.activeId) S.activeId = m.id;
  }
  S.seeded = true; S.seedVersion = ver; save();
}
async function init() {
  await load(); applySeed();
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.t));
  document.addEventListener('pointerdown', unlockAudio, { passive: true }); // iOS só libera som após um toque
  $('#hdrcd').onclick = () => go('painel');
  tickClock(); setInterval(tickClock, 1000);
  setInterval(softRefresh, 30000); // estimativa recalculada a cada 30 s com o app aberto
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickClock(); softRefresh(); } }); // iOS: recalcula ao voltar
  window.addEventListener('resize', () => { if (tab === 'mapa') drawMap(); });
  render();
  if (!S.missions.length) setTimeout(() => toast(window.ZAPP === 'pax' ? 'BEM-VINDO! COLE A MISSÃO ENVIADA NO GRUPO.' : 'BEM-VINDO. CRIE UMA MISSÃO OU IMPORTE O ARQUIVO DA MISSÃO.', ''), 400);
}
window.ZUI = { get S() { return S; }, get MAP() { return MAP; }, render, go };
init();
})();
